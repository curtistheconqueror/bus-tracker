# A staging deploy is triggered only by a dedicated approval record on main, or
# as a manually dispatched fallback. Ordinary feature pushes never deploy.
name: Deploy Cloudflare staging

on:
  push:
    branches: [main]
    paths:
      - .github/release-gates/cloudflare-staging.json
  workflow_dispatch:
    inputs:
      curtis_approval:
        description: "Type CURTIS_APPROVED to deploy the selected main revision to Fleetstep staging"
        required: true
        type: string

permissions:
  contents: read

# Do not let a second approved release replace one already in progress.
concurrency:
  group: fleetstep-cloudflare-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      inputs.curtis_approval == 'CURTIS_APPROVED')
    name: Validate and deploy staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://fleetstep.fleetstep-dev.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Account IDs are normally environment variables. The secret fallback
      # supports the initial setup if it was saved as a secret by mistake.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Push-triggered runs must inspect their parent before deploying.
          fetch-depth: 2

      # The release-gate commit itself must change exactly one file and name
      # its parent. That makes the built source unambiguous and prevents a
      # feature change from quietly riding along with an approval record.
      - name: Verify chat approval gate
        if: github.event_name == 'push'
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { execFileSync } from "node:child_process";
            const gatePath = ".github/release-gates/cloudflare-staging.json";
            const gate = JSON.parse(readFileSync(gatePath, "utf8"));
            if (gate.approval !== "CURTIS_APPROVED") throw new Error("Missing Curtis approval marker.");
            const parent = execFileSync("git", ["rev-parse", "HEAD^"], { encoding: "utf8" }).trim();
            if (gate.approvedSourceCommit !== parent) throw new Error("Approval gate does not name this release source.");
            const changed = execFileSync("git", ["diff", "--name-only", "HEAD^", "HEAD"], { encoding: "utf8" }).trim();
            if (changed !== gatePath) throw new Error("An approval commit may change only the release gate.");
          '

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

      # vinext generates a Worker-ready Wrangler configuration at build time.
      # Deploy it from dist/server so the worker entry and client assets remain
      # in their generated relative locations. --name targets only the existing
      # Cloudflare staging Worker; it does not change the current Sites app.
      - name: Deploy Fleetstep staging
        working-directory: dist/server
        run: npx --no-install wrangler deploy --config wrangler.json --name fleetstep

      - name: Report staging address
        run: echo "Staging deployment complete: https://fleetstep.fleetstep-dev.workers.dev"