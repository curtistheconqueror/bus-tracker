<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>FLEETSTEP</title>
<!-- FS, split on the diagonal: navy above the line, white below it, and the two
     colours swap across it. Full bleed and opaque on purpose — every platform
     applies its own corner mask, and an icon with a transparent ground gets
     filled in black by iOS. No rounded corners here for the same reason.

     The letters are Archivo Black (SIL Open Font License), converted to
     outlines so the icon never depends on a font being installed. Each sits at
     the centre of its own half's inscribed circle, which is what keeps it off
     the dividing line: measured off the rendered artwork, the nearest ink is
     193 units clear on the F and 122 on the S, perpendicular to the diagonal.
     Letters that fill more of each triangle would spill over it. Content stays
     inside the iOS squircle;
     for Android's circular crop see icon-maskable.svg, which is this artwork
     with the letters drawn in closer. -->
<rect width="1024" height="1024" fill="#06275C"/>
<path d="M1024 0V1024H0Z" fill="#FFFFFF"/>
<g transform="translate(169.06 137.98) scale(0.471 -0.471) translate(-74 -688)" fill="#FFFFFF">
<path d="M74 688H630V523H295V405H583V247H295V0H74Z"/>
</g>
<g transform="translate(572.58 556.33) scale(0.471 -0.471) translate(-43 -700)" fill="#06275C">
